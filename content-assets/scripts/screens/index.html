*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;background:#0b141c;color:#fff;font-family:'Montserrat',system-ui,sans-serif;overflow:hidden}

.card:active{background:#22c3f0;color:#0b141c}.n{font-weight:900;font-size:4vh;color:#22c3f0}.card:active .n{color:#0b141c}
.t{font-weight:800;font-size:2.2vh;line-height:1.2}.s{font-weight:600;font-size:1.6vh;color:#9fb4c2;margin-top:.5vh}.off{opacity:.35;cursor:default}
#view{position:fixed;inset:0;background:#000;display:none}#view.on{display:block}
#view iframe,#view img{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:contain;background:#000}

<div class="wrap" id="hub">
 <div class="top"><h1>REEL <span>SCREENS</span></h1><div class="hint">Tap to open full screen &nbsp;·&nbsp; top-left corner to come back &nbsp;·&nbsp; tap the title to refresh</div></div>

card off"><div class="n">12</div><div><div class="t">Abu Dhabi Supply Can&#x27;t Keep Up</div><div class="s">Graph - coming</div></div></div></div>

<script>
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
document.querySelector('h1').addEventListener('click',e=>{e.stopPropagation();location.replace(location.pathname+'?v='+Date.now());});
const D={"11": {"src": "11-chart.jpg", "kind": "img"}, "09": {"src": "09-map.jpg", "kind": "img"}, "10": {"src": "10-map.jpg", "kind": "img"}, "maps": {"src": "https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d36453!2d54.4154442!3d24.441114!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sae!4v1731400000000", "kind": "frame"}, "modon": {"src": "https://world.modon.com/abu-dhabi/", "kind": "frame"}, "aldar": {"src": "https://world.aldar.com/uae", "kind": "frame"}, "01": {"src": "https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d36453!2d54.4154442!3d24.441114!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sae!4v1731400000000", "kind": "frame"}, "02": {"src": "https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d36453!2d54.4154442!3d24.441114!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sae!4v1731400000000", "kind": "frame"}, "03": {"src": "https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d36453!2d54.4154442!3d24.441114!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e1!3m2!1sen!2sae!4v1731400000000", "kind": "frame"}, "04": {"src": "https://world.aldar.com/uae", "kind": "frame"}, "05": {"src": "https://world.aldar.com/uae", "kind": "frame"}, "06": {"src": "bvlgari-map.jpg", "kind": "img"}, "07": {"src": "https://world.modon.com/abu-dhabi/", "kind": "frame"}, "08": {"src": "https://world.modon.com/abu-dhabi/", "kind": "frame"}};
const view=document.getElementById('view'),start=document.getElementById('start');
function fs(){const e=document.documentElement;if(!document.fullscreenElement&&e.requestFullscreen)e.requestFullscreen({navigationUI:'hide'}).catch(()=>{});}
function show(id){const v=D[id];if(!v)return;if(v.kind==='link'){location.href=v.src;return;}[...view.querySelectorAll('iframe,img')].forEach(x=>x.remove());
 let el;if(v.kind==='img'){el=document.createElement('img');el.src=v.src;}else{el=document.createElement('iframe');el.src=v.src;el.allow='fullscreen; geolocation; accelerometer; gyroscope; autoplay';el.referrerPolicy='no-referrer-when-downgrade';if(v.src.indexOf('google.com/maps')>-1){el.style.top='-90px';el.style.height='calc(100% + 90px)';}}
 view.insertBefore(el,view.firstChild);view.classList.add('on');history.replaceState(null,'','#'+id);}
function hub(){view.classList.remove('on');[...view.querySelectorAll('iframe,img')].forEach(x=>x.remove());history.replaceState(null,'',location.pathname);}
document.querySelectorAll('button.card,button.q').forEach(b=>b.addEventListener('click',()=>{fs();show(b.dataset.id);}));
document.getElementById('back').addEventListener('click',hub);
document.getElementById('hub').addEventListener('click',fs);
const h=location.hash.slice(1);if(D[h]){start.classList.add('on');start.addEventListener('click',()=>{fs();start.classList.remove('on');show(h);},{once:true});}
document.addEventListener('keydown',e=>{if(e.key==='Escape')hub();});
</script></body></html>
