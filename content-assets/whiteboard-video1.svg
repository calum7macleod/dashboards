<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 800" font-family="'Segoe Print','Bradley Hand','Comic Sans MS',cursive">
  <!-- wall -->
  <rect width="1240" height="800" fill="#e8e4dc"/>
  <!-- board frame -->
  <rect x="30" y="24" width="1180" height="700" rx="14" fill="#c9ccd1"/>
  <rect x="44" y="38" width="1152" height="672" rx="8" fill="#fdfdfb"/>
  <!-- marker tray -->
  <rect x="420" y="726" width="400" height="16" rx="6" fill="#b7bac0"/>
  <rect x="470" y="716" width="70" height="12" rx="6" fill="#111"/>
  <rect x="560" y="716" width="70" height="12" rx="6" fill="#1c7c3c"/>
  <rect x="650" y="716" width="70" height="12" rx="6" fill="#c0272d"/>

  <!-- ================= TOP HOOK ================= -->
  <text x="80" y="106" font-size="44" fill="#111" transform="rotate(-1.2 80 106)">£100K</text>
  <!-- big arrow -->
  <path d="M 215 92 C 280 70, 340 70, 400 90" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 388 76 L 404 91 L 383 98" stroke="#111" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="418" y="108" font-size="46" fill="#1c7c3c" transform="rotate(-1 418 108)">£3.2 MILLION</text>
  <!-- red underline scribble -->
  <path d="M 416 122 C 520 132, 640 124, 748 130" stroke="#c0272d" stroke-width="5" fill="none" stroke-linecap="round"/>
  <text x="790" y="86" font-size="20" fill="#555" transform="rotate(2 790 86)">"the family legacy"</text>

  <!-- ================= LEFT PANEL : THE DEAL ================= -->
  <!-- little house sketch -->
  <g transform="translate(85,175) rotate(-1)">
    <path d="M 0 55 L 45 15 L 90 55" stroke="#111" stroke-width="5" fill="none" stroke-linejoin="round"/>
    <rect x="10" y="55" width="70" height="52" stroke="#111" stroke-width="5" fill="none"/>
    <rect x="38" y="74" width="18" height="33" stroke="#111" stroke-width="4" fill="none"/>
  </g>
  <text x="195" y="215" font-size="30" fill="#111">Đ1M house</text>
  <text x="195" y="252" font-size="26" fill="#111">50/50 plan →</text>
  <text x="370" y="252" font-size="28" fill="#1c7c3c">you pay Đ500K</text>
  <!-- circled 500K -->
  <ellipse cx="465" cy="243" rx="112" ry="26" stroke="#c0272d" stroke-width="4" fill="none" transform="rotate(-2 465 243)"/>

  <!-- THE MAGIC LINE -->
  <g transform="rotate(-1 90 330)">
    <text x="90" y="330" font-size="30" fill="#111">house +50%</text>
    <text x="292" y="330" font-size="30" fill="#111">=</text>
    <text x="325" y="330" font-size="32" fill="#c0272d">YOUR MONEY ×2</text>
  </g>
  <path d="M 322 344 C 400 352, 500 346, 580 350" stroke="#c0272d" stroke-width="4" fill="none" stroke-linecap="round"/>
  <text x="90" y="378" font-size="22" fill="#555">sell at handover · every 4 yrs · repeat ↺</text>

  <!-- divider squiggle -->
  <path d="M 70 408 C 220 400, 420 416, 600 406" stroke="#999" stroke-width="2.5" fill="none" stroke-dasharray="1 9" stroke-linecap="round"/>

  <!-- ================= THE STAIRCASE (signature) ================= -->
  <!-- steps rising left->right; each step: amount, tiny houses, year -->
  <g stroke="#111" stroke-width="5" fill="none" stroke-linejoin="round">
    <path d="M 95 640 H 250 V 585 H 415 V 525 H 585 V 460 H 760 V 390 H 945 V 305 H 1140"/>
  </g>

  <!-- step labels: money (green), houses count, year (grey) -->
  <g font-size="26" fill="#1c7c3c">
    <text x="118" y="628" transform="rotate(-1 118 628)">Đ1M</text>
    <text x="272" y="572" transform="rotate(-1 272 572)">Đ2M</text>
    <text x="440" y="512" transform="rotate(-1 440 512)">Đ4M</text>
    <text x="610" y="447" transform="rotate(-1 610 447)">Đ8M</text>
  </g>
  <text x="790" y="372" font-size="30" fill="#1c7c3c" transform="rotate(-1 790 372)">Đ16M</text>

  <!-- tiny houses per rung -->
  <g fill="none" stroke="#111" stroke-width="3">
    <path d="M118 596 l10 -9 10 9 z M118 596 h20 v12 h-20 z"/>
    <path d="M268 540 l10 -9 10 9 z M268 540 h20 v12 h-20 z"/>
    <path d="M296 540 l10 -9 10 9 z M296 540 h20 v12 h-20 z"/>
    <path d="M436 480 l10 -9 10 9 z M436 480 h20 v12 h-20 z"/>
    <path d="M464 480 l10 -9 10 9 z M464 480 h20 v12 h-20 z"/>
    <path d="M492 480 l10 -9 10 9 z M492 480 h20 v12 h-20 z"/>
    <path d="M520 480 l10 -9 10 9 z M520 480 h20 v12 h-20 z"/>
  </g>
  <text x="612" y="428" font-size="22" fill="#111">8 houses</text>
  <text x="792" y="340" font-size="24" fill="#c0272d" transform="rotate(-1 792 340)">16 HOUSES → SELL ALL</text>

  <!-- years under steps -->
  <g font-size="18" fill="#777">
    <text x="140" y="666">yr 4</text>
    <text x="300" y="666">yr 8</text>
    <text x="468" y="666">yr 12</text>
    <text x="648" y="666">yr 16</text>
    <text x="830" y="666">yr 20</text>
  </g>

  <!-- doubling arrows between steps -->
  <g stroke="#c0272d" stroke-width="3.5" fill="none" stroke-linecap="round">
    <path d="M 232 612 C 250 598, 258 596, 268 590"/>
    <path d="M 398 556 C 416 542, 424 540, 434 532"/>
    <path d="M 568 494 C 586 478, 594 476, 604 468"/>
    <path d="M 742 426 C 760 410, 768 406, 778 398"/>
  </g>
  <text x="238" y="600" font-size="18" fill="#c0272d">×2</text>
  <text x="404" y="544" font-size="18" fill="#c0272d">×2</text>
  <text x="574" y="482" font-size="18" fill="#c0272d">×2</text>
  <text x="748" y="414" font-size="18" fill="#c0272d">×2</text>

  <!-- ================= PAYOFF (bottom right) ================= -->
  <g transform="rotate(-1.5 950 560)">
    <text x="880" y="520" font-size="40" fill="#1c7c3c">= £3.2M</text>
  </g>
  <!-- double red circle around payoff -->
  <ellipse cx="972" cy="507" rx="140" ry="46" stroke="#c0272d" stroke-width="5" fill="none" transform="rotate(-2 972 507)"/>
  <ellipse cx="974" cy="509" rx="150" ry="54" stroke="#c0272d" stroke-width="3" fill="none" transform="rotate(-1 974 509)"/>

  <text x="872" y="588" font-size="22" fill="#111">5 rungs · 20 years</text>
  <text x="872" y="620" font-size="22" fill="#111">no new money after day 1</text>
  <!-- the kicker -->
  <text x="872" y="662" font-size="24" fill="#c0272d" transform="rotate(-1 872 662)">+ rent not even counted!</text>
  <!-- star doodle -->
  <path d="M 1130 640 l6 14 15 2 -11 10 3 15 -13 -8 -13 8 3 -15 -11 -10 15 -2 z" fill="none" stroke="#c0272d" stroke-width="3" stroke-linejoin="round"/>
</svg>
