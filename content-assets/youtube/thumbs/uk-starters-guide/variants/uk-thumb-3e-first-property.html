<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#152A1F}
.t{width:1280px;height:720px;position:relative;overflow:hidden;background:#152A1F;font-family:Carlito,Calibri,sans-serif;color:#F5EDE0}
.bg{position:absolute;inset:0;background-size:cover;background-position:center}
.dark{position:absolute;inset:0}
.face{position:absolute;bottom:-24px;right:-70px;height:720px}

.txt{position:absolute;left:56px;top:0;height:720px;width:760px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.w{font-size:122px;font-weight:700;line-height:.94;letter-spacing:-.012em;text-transform:uppercase;text-shadow:0 4px 0 #0c1a12,0 10px 30px rgba(0,0,0,.6)}

.arrow{font-size:72px;color:#E8C96B;font-weight:700;line-height:1;text-shadow:0 4px 0 #0c1a12}
.bar{position:absolute;left:0;top:0;width:14px;height:720px;background:#C9A84C}
.tag{position:absolute;left:56px;top:48px;font-size:26px;letter-spacing:.3em;text-transform:uppercase;color:#C9A84C;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.6)}
</style></head><body><div class="t"><div class="bg" style="background-image:url(bg-aerial.jpg)"></div><div class="dark" style="background:linear-gradient(90deg,rgba(21,42,31,.95) 0%,rgba(21,42,31,.82) 50%,rgba(21,42,31,.3) 100%)"></div><div class="bar"></div><img class="face" src="face-cut.png"><div class="txt" style="gap:2px"><div class="flags"><svg viewBox="0 0 60 30" width="150" height="75" style="border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.5)"><clipPath id="c"><rect width="60" height="30"/></clipPath><g clip-path="url(#c)"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="2"/><path d="M30,0 V30 M0,15 H60" stroke="#fff" stroke-width="10"/><path d="M30,0 V30 M0,15 H60" stroke="#C8102E" stroke-width="6"/></g></svg><span class="arrow">→</span><svg viewBox="0 0 60 30" width="150" height="75" style="border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.5)"><rect width="60" height="30" fill="#00732F"/><rect y="10" width="60" height="10" fill="#fff"/><rect y="20" width="60" height="10" fill="#000"/><rect width="15" height="30" fill="#FF0000"/></svg></div><div class="w md">Your first</div><div class="w g">Dubai property</div><div class="w md" style="font-size:80px">from the UK</div></div></div></body></html>
