<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Calum MacLeod</title>
<style>
:root{--bg:#152A1F;--panel:#1E3D2F;--card:#162b20;--gold:#C9A84C;--lgold:#E8C96B;--cream:#F5EDE0;--muted:#8FA898;--div:#2E5A40;--red:#f85149;--green:#3fb950;--amber:#d29922}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--cream);font-family:Calibri,'Segoe UI',sans-serif;min-height:100vh;padding:12px}
h1,h2,h3{font-family:'Palatino Linotype',Palatino,serif}
.eyebrow{letter-spacing:4px;font-size:11px;font-weight:bold;color:var(--gold);text-transform:uppercase;text-align:center;margin:4px 0 2px}
h1{text-align:center;font-size:24px;margin-bottom:10px}
.tabs{display:flex;gap:8px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.tab{background:var(--panel);border:1px solid var(--div);color:var(--cream);padding:9px 18px;border-radius:20px;cursor:pointer;font-size:14px;font-weight:bold}
.tab.on{background:var(--gold);color:#152A1F;border-color:var(--gold)}
.btn{background:var(--gold);color:#152A1F;font-weight:bold;border:none;border-radius:9px;padding:9px 14px;cursor:pointer;font-size:13px}
.btn.sec{background:transparent;color:var(--lgold);border:1px solid var(--div)}
.mini{padding:6px 10px;font-size:12px;border-radius:7px}
.hidden{display:none!important}
.wrap{max-width:97vw;margin:0 auto}
.panelbox{background:var(--panel);border:1px solid var(--div);border-radius:14px;padding:12px;margin-bottom:14px}
.touchrow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--div);flex-wrap:wrap}
.touchrow:first-of-type{border-top:none}
.tname{font-weight:bold;min-width:120px;cursor:pointer}
.treason{color:var(--muted);font-size:13px;flex:1;min-width:150px}
.due-over{color:var(--red);font-size:12px;font-weight:bold}
.due-today{color:var(--amber);font-size:12px;font-weight:bold}
#board,#sboard{display:flex;gap:10px;overflow-x:auto;padding-bottom:16px}
.col{background:var(--panel);border:1px solid var(--div);border-radius:14px;min-width:150px;flex:1 1 0;padding:8px}
@media(max-width:1100px){.col{min-width:220px;flex:0 0 auto}}
.col h3{font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between;margin-bottom:4px}
.colval{font-size:11px;color:var(--muted);margin-bottom:8px}
.col.dragover{outline:2px dashed var(--lgold)}
.card{background:var(--card);border:1px solid var(--div);border-radius:11px;padding:9px;margin-bottom:8px;cursor:grab}
.card .nm{font-weight:bold;font-size:14px}
.heat{color:var(--lgold);font-size:11.5px;letter-spacing:1px}
.fsel{background:var(--card);color:var(--cream,#F5EDE0);border:1px solid var(--gold);border-radius:6px;padding:5px 8px;font-size:12px}
.card .need{color:var(--muted);font-size:11.5px;margin:3px 0}
.nt{font-size:11.5px}.nt.over{color:var(--red)}.nt.today{color:var(--amber)}.nt.ok{color:var(--muted)}
.bdg{font-size:11.5px;color:var(--cream)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-start;justify-content:center;padding:12px;z-index:50;overflow-y:auto}
#mbox{background:var(--panel);border:1px solid var(--div);border-radius:16px;max-width:620px;width:100%;padding:16px;margin:10px 0 40px}
.phead{display:flex;gap:14px;align-items:center;border-bottom:1px solid var(--div);padding-bottom:12px;margin-bottom:10px;flex-wrap:wrap}
.heatball{width:74px;height:74px;border-radius:50%;background:var(--card);border:3px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:0 0 auto}
.heatball b{font-size:26px;color:var(--lgold);font-family:'Palatino Linotype',serif}
.heatball span{font-size:9px;letter-spacing:2px;color:var(--muted)}
.pmeta{flex:1;min-width:200px}
.pmeta h2{color:var(--cream);font-size:22px}
.pmeta .sub{color:var(--muted);font-size:13px;margin-top:2px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{background:var(--card);border:1px solid var(--div);border-radius:14px;padding:4px 10px;font-size:12px;color:var(--cream)}
.drivers{background:var(--card);border:1px solid var(--div);border-radius:10px;padding:9px;margin:10px 0;font-size:12.5px;color:var(--muted)}
.drivers b{color:var(--lgold)}
.tl{margin-top:10px}
.tlrow{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--div)}
.tlic{flex:0 0 26px;text-align:center;font-size:15px}
.tlbody{flex:1}
.tldate{font-size:11px;color:var(--muted)}
.tltext{font-size:13px;color:var(--cream)}
.mrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
select,input[type=date],input[type=text]{background:#12241b;color:var(--cream);border:1px solid var(--div);border-radius:7px;padding:8px;font-size:13px}
#peopleList .touchrow{cursor:pointer}
#search{width:100%;max-width:420px;margin:0 auto 12px;display:block}
#sync{position:fixed;bottom:8px;left:10px;font-size:11.5px;color:var(--muted);background:rgba(21,42,31,.9);padding:4px 8px;border-radius:8px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px}
.connect{background:var(--panel);border:1px solid var(--div);border-radius:12px;padding:14px;max-width:560px;margin:0 auto 14px}
.connect input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--div);background:#12241b;color:var(--cream);margin:8px 0}
a.act{color:#152A1F;background:var(--lgold);border-radius:8px;padding:7px 12px;font-weight:bold;text-decoration:none;font-size:13px}
</style>
</head>
<body>
<div class="eyebrow">White &amp; Co · Calum MacLeod</div>
<h1>CRM</h1>
<div class="connect" id="connectBox"><b>🔌 Connect GitHub</b>
<input id="patIn" placeholder="github_pat_..." /><button class="btn" onclick="savePat()">Connect</button></div>
<div class="tabs">
  <div class="tab on" data-t="today" onclick="tab('today')">Today</div>
  <div class="tab" data-t="pipeline" onclick="tab('pipeline')">Pipeline</div>
  <div class="tab" data-t="people" onclick="tab('people')">People</div>
  <div class="tab" data-t="sellers" onclick="tab('sellers')">Sellers</div>
</div>
<div class="wrap">
  <div id="v-today">
    <div class="panelbox"><h2 style="color:var(--lgold);font-size:17px;margin-bottom:6px">Today's Touches</h2><div id="touchList"></div></div>
    <div class="panelbox"><h2 style="color:var(--lgold);font-size:17px;margin-bottom:6px">Unit ↔ Buyer Matches</h2><div id="matchList"></div></div>
  </div>
  <div id="v-pipeline" class="hidden">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;flex-wrap:wrap;gap:8px">
      <div id="pipeTotals" style="font-size:13px;color:var(--muted)"></div>
      <button class="btn" onclick="newBuyer()">+ New Buyer</button>
    </div>
    <div id="filtbar" style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <select id="f-cluster" onchange="setF()" class="fsel"></select>
      <select id="f-budget" onchange="setF()" class="fsel">
        <option value="">Any budget</option><option value="2500000">≤ 2.5M</option>
        <option value="3000000">≤ 3M</option><option value="3500000">≤ 3.5M</option>
        <option value="99999999">3.5M+</option>
      </select>
      <select id="f-beds" onchange="setF()" class="fsel">
        <option value="">Any beds</option><option>3</option><option>4</option><option>5</option>
      </select>
      <select id="f-fin" onchange="setF()" class="fsel">
        <option value="">Any finance</option><option value="cash">Cash</option><option value="mortgage">Mortgage</option>
      </select>
      <select id="f-seg" onchange="setF()" class="fsel">
        <option value="">Secondary + Offplan</option><option value="Offplan">Offplan only</option><option value="secondary">Secondary only</option>
      </select>
      <button class="btn sec mini" onclick="clearF()">Clear</button>
    </div>
    <div id="board"></div>
  </div>
  <div id="v-people" class="hidden">
    <input type="text" id="search" placeholder="Search people…" oninput="renderPeople()">
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px">
      <select id="p-role" onchange="renderPeople()" class="fsel">
        <option value="">Everyone</option><option value="buyer">Buyers</option>
        <option value="offplan">Off-plan buyers</option><option value="seller">Sellers</option>
      </select>
      <select id="p-cluster" onchange="renderPeople()" class="fsel"></select>
      <select id="p-budget" onchange="renderPeople()" class="fsel">
        <option value="">Any budget</option><option value="2500000">≤ 2.5M</option>
        <option value="3000000">≤ 3M</option><option value="3500000">≤ 3.5M</option>
        <option value="99999999">3.5M+</option>
      </select>
      <select id="p-beds" onchange="renderPeople()" class="fsel">
        <option value="">Any beds</option><option>3</option><option>4</option><option>5</option>
      </select>
      <select id="p-fin" onchange="renderPeople()" class="fsel">
        <option value="">Any finance</option><option value="cash">Cash</option><option value="mortgage">Mortgage</option>
      </select>
    </div>
    <div class="panelbox" id="peopleList"></div>
  </div>
  <div id="v-sellers" class="hidden">
    <div id="sTotals" style="font-size:13px;color:var(--muted);margin-bottom:8px"></div>
    <div id="sboard"></div>
  </div>
</div>
<div id="modal" class="hidden" onclick="if(event.target.id==='modal')closeModal()"><div id="mbox"></div></div>
<div id="sync"><span class="dot"></span><span id="syncTxt">Loading…</span></div>
<script>
const OWNER='calum7macleod', REPO='dashboards';
const STAGES=['Longer Term','New','Qualified','Viewing','Offer','Won','Lost'];
const SSTAGES=['Longer Term','New','Qualified','Ready','Offer','Won','Lost'];
const SMIG={'Active':'Qualified','Sold':'Won','Later':'Longer Term'};
function migSellerStages(){STOCK.forEach(s=>{if(SMIG[s.stage])s.stage=SMIG[s.stage];if(!s.stage||!SSTAGES.includes(s.stage))s.stage=s.stage&&SSTAGES.includes(s.stage)?s.stage:'New';});}
const CAD={5:1,4:2,3:3,2:4,1:5};
let BUYERS=[], STOCK=[], VIEWINGS=[], SHAS={}, PAT=localStorage.getItem('crm_pat')||'';
let showSnoozed=false, curTab='today';
const $=id=>document.getElementById(id);
const today=()=>new Date().toISOString().slice(0,10);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)};
function savePat(){PAT=$('patIn').value.trim();if(!PAT)return;localStorage.setItem('crm_pat',PAT);init()}
async function fetchFile(path){
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}?ref=main&t=${Date.now()}`,{headers:PAT?{Authorization:'Bearer '+PAT}:{}});
  const j=await r.json(); SHAS[path]=j.sha;
  return JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
}
let saveTimer=null;
function queueSave(path,data,msg){$('syncTxt').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>push(path,data,msg),1000)}
async function push(path,data,msg){
  try{
    const body={message:msg||'CRM update',content:btoa(unescape(encodeURIComponent(JSON.stringify(data,null,1)))),sha:SHAS[path],branch:'main'};
    const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+PAT,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(r.ok){SHAS[path]=j.content.sha;$('syncTxt').textContent='Synced '+new Date().toLocaleTimeString()}
    else if(r.status===409){await fetchAll();$('syncTxt').textContent='Conflict — refreshed, redo change'}
    else $('syncTxt').textContent='Save failed ('+r.status+')';
  }catch(e){$('syncTxt').textContent='Offline — retrying';setTimeout(()=>push(path,data,msg),4000)}
}
const heatStr=h=>'';
const scr=b=>(typeof b.score==='number'&&b.score>0)?String(Math.round(b.score)):'—';
let FILT={cluster:'',budget:'',beds:'',fin:'',seg:''};
function setF(){FILT={cluster:$('f-cluster').value,budget:$('f-budget').value,beds:$('f-beds').value,fin:$('f-fin').value,seg:$('f-seg').value};renderBoard();}
function clearF(){['f-cluster','f-budget','f-beds','f-fin','f-seg'].forEach(i=>$(i).value='');FILT={cluster:'',budget:'',beds:'',fin:'',seg:''};renderBoard();}
function passF(b){
  if(FILT.cluster&&![b.cluster1,b.cluster2,b.cluster3].filter(Boolean).some(c=>c===FILT.cluster))return false;
  if(FILT.budget){const bd=b.budget||0;if(FILT.budget==='99999999'){if(bd<=3500000)return false;}else if(bd>+FILT.budget||!bd)return false;}
  if(FILT.beds&&String(b.beds||'').indexOf(FILT.beds)===-1)return false;
  if(FILT.fin&&!(b.finance||'').toLowerCase().includes(FILT.fin))return false;
  if(FILT.seg==='Offplan'&&b.segment!=='Offplan')return false;
  if(FILT.seg==='secondary'&&b.segment==='Offplan')return false;
  return true;}
function fillClusterFilter(){const cs=[...new Set([...BUYERS.flatMap(b=>[b.cluster1,b.cluster2,b.cluster3]),...STOCK.map(s=>s.cluster)].filter(Boolean))].sort();
  const opts='<option value="">Any cluster</option>'+cs.map(c=>`<option>${c}</option>`).join('');
  if($('f-cluster'))$('f-cluster').innerHTML=opts;
  if($('p-cluster'))$('p-cluster').innerHTML=opts;}
function syncHeatFromScore(){BUYERS.forEach(b=>{if(typeof b.score==='number'&&b.score>1.01)b.heat=Math.min(5,Math.max(1,Math.round(b.score)));else if(typeof b.score==='number'&&b.score>0){b.score=Math.min(5,Math.max(1,Math.round(b.score*5)));b.heat=b.score;}});}
const ntClass=nt=>!nt?'ok':nt<today()?'over':nt===today()?'today':'ok';
const fmtB=b=>b?'Đ'+(b/1e6).toFixed(2).replace(/\.?0+$/,'')+'M':'';
let DEALS=[],BOARDPCT=0.02,TIER=0.65; // tier: Q3-26 65%, Q4-26 70%
function calcComm(){const v=DEALS.reduce((a,x)=>a+(+x.price||0),0);const bd=DEALS.reduce((a,x)=>a+(+x.myBoard||0),0);
  if(v>0&&bd>0)BOARDPCT=bd/v;}
const commOf=v=>v?Math.round(v*BOARDPCT*TIER):0;
const commLbl=()=>`${(BOARDPCT*100).toFixed(2)}% board × ${Math.round(TIER*100)}% tier = ${(BOARDPCT*TIER*100).toFixed(2)}%`;
function suggestedHeat(b){
  // THE BRAIN v1: recency + stage + momentum
  let s=3;
  const lc=b.lastContact||b.date; const days=lc?Math.floor((new Date(today())-new Date(lc))/864e5):99;
  if(days<=2)s+=1; else if(days>10)s-=1; if(days>21)s-=1;
  if(['Viewing','Offer'].includes(b.stage))s+=1;
  const t=(b.touches||[]).filter(x=>x.date>=addDays(today(),-14)).length;
  if(t>=3)s+=1;
  return Math.min(5,Math.max(1,s));
}
function heatDrivers(b){
  const lc=b.lastContact||b.date; const days=lc?Math.floor((new Date(today())-new Date(lc))/864e5):'?';
  const t14=(b.touches||[]).filter(x=>x.date>=addDays(today(),-14)).length;
  const sug=suggestedHeat(b);
  return `Last contact <b>${days}d ago</b> · <b>${t14}</b> touches in 14d · stage <b>${b.stage}</b> · system read: <b>${sug}</b>${Math.abs(sug-(b.score||0))>=2?' — consider updating score':''}`;
}
function tab(t){curTab=t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  ['today','pipeline','people','sellers'].forEach(v=>$('v-'+v).classList.toggle('hidden',v!==t));}
async function fetchAll(){
  BUYERS=await fetchFile('data/buyers.json');
  try{STOCK=await fetchFile('data/stock.json')}catch(e){STOCK=[]}
  try{VIEWINGS=await fetchFile('data/viewings.json')}catch(e){VIEWINGS=[]}
  try{DEALS=await fetchFile('data/deals.json');calcComm()}catch(e){}
  syncHeatFromScore();fillClusterFilter();migSellerStages();
}
function render(){renderToday();renderBoard();renderPeople();renderSellers();}
function renderToday(){
  const due=BUYERS.filter(b=>!['Won','Lost','Snoozed','Longer Term'].includes(b.stage)&&b.nextTouch&&b.nextTouch<=today()).sort((a,b)=>(b.score||0)-(a.score||0));
  const wake=BUYERS.filter(b=>b.stage==='Snoozed'&&b.snoozedUntil&&b.snoozedUntil<=today());
  $('touchList').innerHTML=[...wake.map(b=>trow(b,true)),...due.map(b=>trow(b,false))].join('')||'<div style="color:var(--muted);padding:6px">Nothing due — clear runway 👌</div>';
  const M=computeMatches();
  $('matchList').innerHTML=M.slice(0,10).map(({u,hits})=>`<div class="touchrow"><span class="tname">${u.cluster} ${u.unit}</span><span class="bdg">${fmtB(u.price)}</span>
   <span class="treason">${hits.slice(0,5).map(h=>`<span style="cursor:pointer" onclick="openCard('${h.id}')">${h.buyer}</span> <b style="color:var(--lgold)">${scr(h)}</b>${h.stage==='Snoozed'?'💤':''}`).join(' · ')}</span></div>`).join('')||'<div style="color:var(--muted);padding:6px">No matches — fill budgets/beds</div>';
}
function trow(b,isWake){return `<div class="touchrow"><span class="tname" onclick="openCard('${b.id}')">${b.buyer}</span>
 <span class="${b.nextTouch<today()?'due-over':'due-today'}">${isWake?'WAKING':(b.nextTouch<today()?'OVERDUE':'DUE TODAY')}</span>
 <span class="treason">${b.touchReason||b.needSummary||''}</span>
 <button class="btn mini" onclick="touched('${b.id}')">Touched ✓</button></div>`}
function renderBoard(){
  const live=BUYERS.filter(b=>!['Won','Lost','Snoozed','Longer Term'].includes(b.stage)&&passF(b));
  const pipeVal=live.reduce((a,b)=>a+(b.budget||0),0);
  $('pipeTotals').innerHTML=`Pipeline: <b style="color:var(--lgold)">${fmtB(pipeVal)}</b> · your comms if it all lands ≈ <b style="color:var(--lgold)">Đ${commOf(pipeVal).toLocaleString()}</b> <span style="font-size:11px">(${commLbl()})</span>`;
  $('board').innerHTML=STAGES.map(st=>{
    const cards=BUYERS.filter(b=>b.stage===st&&passF(b)).sort((a,b)=>(b.score||0)-(a.score||0));
    const val=cards.reduce((a,b)=>a+(b.budget||0),0);
    return `<div class="col" ondragover="dragOver(event)" ondragleave="this.classList.remove('dragover')" ondrop="drop(event,'${st}','buyer')">
      <h3>${st} <span style="color:var(--muted)">${cards.length}</span></h3><div class="colval">${val?fmtB(val):''}</div>
      ${cards.map(cardHtml).join('')}</div>`;
  }).join('')+snoozedCol();
}
function cardHtml(b){return `<div class="card" draggable="true" ondragstart="drag(event,'${b.id}')" onclick="openCard('${b.id}')">
  <div class="nm">${b.buyer||'?'}</div><div class="heat"><b>${scr(b)}</b> <span class="bdg">${fmtB(b.budget)}</span></div>
  <div class="need">${(b.needSummary||'').slice(0,64)}</div>
  <div class="nt ${ntClass(b.nextTouch)}">⏰ ${b.nextTouch||'—'}</div></div>`}
function snoozedCol(){
  const sn=BUYERS.filter(b=>b.stage==='Snoozed').sort((a,b)=>(a.snoozedUntil||'9').localeCompare(b.snoozedUntil||'9'));
  return `<div class="col" style="opacity:.85" ondragover="dragOver(event)" ondragleave="this.classList.remove('dragover')" ondrop="drop(event,'Snoozed','buyer')">
   <h3 onclick="showSnoozed=!showSnoozed;renderBoard()" style="cursor:pointer">💤 Snoozed <span style="color:var(--muted)">${sn.length} ${showSnoozed?'▾':'▸'}</span></h3>
   ${showSnoozed?sn.map(b=>`<div class="card" draggable="true" ondragstart="drag(event,'${b.id}')" onclick="openCard('${b.id}')"><div class="nm">${b.buyer}</div><div class="nt ok">wakes ${b.snoozedUntil||'?'}</div><div class="need">${(b.touchReason||'').slice(0,55)}</div></div>`).join(''):''}</div>`}
function renderPeople(){
  const q=($('search').value||'').toLowerCase();
  const role=$('p-role')?$('p-role').value:'';
  const fc=$('p-cluster')?$('p-cluster').value:'', fb=$('p-budget')?$('p-budget').value:'',
        fd=$('p-beds')?$('p-beds').value:'', ff=$('p-fin')?$('p-fin').value:'';
  const pf=(cl,bd,beds,fin)=>{
    if(fc&&!cl.includes(fc))return false;
    if(fb){if(fb==='99999999'){if((bd||0)<=3500000)return false}else if(!bd||bd>+fb)return false;}
    if(fd&&String(beds||'').indexOf(fd)===-1)return false;
    if(ff&&!(fin||'').toLowerCase().includes(ff))return false;
    return true;};
  let rows=[];
  if(role!=='seller'){
    BUYERS.filter(b=>{
      if(role==='offplan'&&b.segment!=='Offplan')return false;
      if(role==='buyer'&&b.segment==='Offplan')return false;
      return pf([b.cluster1,b.cluster2,b.cluster3].filter(Boolean),b.budget,b.beds,b.finance)
        &&(!q||JSON.stringify(b).toLowerCase().includes(q));
    }).sort((a,b)=>(b.score||0)-(a.score||0)).forEach(b=>rows.push(
      `<div class="touchrow" onclick="openCard('${b.id}')">
       <span class="tname">${b.buyer}</span><span class="heat"><b>${scr(b)}</b></span>
       <span class="bdg">${b.segment==='Offplan'?'Off-plan · ':''}${b.stage}${b.stage==='Snoozed'&&b.snoozedUntil?' → '+b.snoozedUntil:''}</span>
       <span class="treason">${(b.needSummary||b.notes||'').slice(0,70)}</span></div>`));
  }
  if(!role||role==='seller'){
    STOCK.filter(s=>pf([s.cluster].filter(Boolean),s.price,s.beds,'')
      &&(!q||JSON.stringify(s).toLowerCase().includes(q)))
      .forEach(s=>rows.push(
      `<div class="touchrow" onclick="openStock('${s.id}')">
       <span class="tname">${s.seller||s.owner||s.unit||'Seller'}</span><span class="heat" style="color:var(--muted)">SELLER</span>
       <span class="bdg">${sStage(s)} · ${s.cluster||''} ${s.unit||''} · ${fmtB(s.price)}</span>
       <span class="treason">${(s.notes||'').slice(0,70)}</span></div>`));
  }
  $('peopleList').innerHTML=rows.join('')||'<div style="color:var(--muted)">No matches</div>';
}
function renderSellers(){
  const val=STOCK.filter(s=>!['Won','Lost','Longer Term'].includes(sStage(s))).reduce((a,s)=>a+(s.price||0),0);
  $('sTotals').innerHTML=`Stock book: <b style="color:var(--lgold)">${fmtB(val)}</b> across ${STOCK.filter(s=>!['Won','Lost','Longer Term'].includes(sStage(s))).length} live units · projected commission ≈ <b style="color:var(--lgold)">Đ${commOf(val).toLocaleString()}</b>`;
  $('sboard').innerHTML=SSTAGES.map(st=>{
    const cards=STOCK.filter(s=>sStage(s)===st);
    const v=cards.reduce((a,s)=>a+(s.price||0),0);
    return `<div class="col" ondragover="dragOver(event)" ondragleave="this.classList.remove('dragover')" ondrop="drop(event,'${st}','seller')">
     <h3>${st} <span style="color:var(--muted)">${cards.length}</span></h3><div class="colval">${v?fmtB(v):''}</div>
     ${cards.map(s=>`<div class="card" draggable="true" ondragstart="drag(event,'stock:${s.id}')" onclick="openStock('${s.id}')">
      <div class="nm">${s.cluster||''} ${s.unit||''}</div><div class="heat"><span class="bdg">${fmtB(s.price)}${s.beds?' · '+s.beds+'bd':''}</span></div>
      <div class="need">${(s.seller||'')} ${(s.notes||'').slice(0,45)}</div></div>`).join('')}</div>`;
  }).join('');
}
function sStage(s){
  if(s.stage)return s.stage;
  const st=(s.status||'').toLowerCase();
  if(st.includes('sold'))return'Sold'; if(st.includes('offer'))return'Offer';
  if(st.includes('later')||st.includes('snooze')||st.includes('park'))return'Later';
  if(st.includes('lost')||st.includes('dead'))return'Lost';
  return'Active';
}
let dragId=null;
function drag(e,id){dragId=id}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('dragover')}
function drop(e,stage,kind){e.preventDefault();e.currentTarget.classList.remove('dragover');
  if(kind==='seller'&&dragId.startsWith('stock:')){
    const s=STOCK.find(x=>String(x.id)===dragId.slice(6));if(!s)return;
    s.stage=stage;renderSellers();queueSave('data/stock.json',STOCK,`CRM: ${s.unit} → ${stage}`);return;}
  const b=BUYERS.find(x=>x.id===dragId);if(!b)return;
  b.stage=stage;if(['Won','Lost'].includes(stage))b.nextTouch=null;
  render();queueSave('data/buyers.json',BUYERS,`CRM: ${b.buyer} → ${stage}`);}
const byId=id=>BUYERS.find(x=>x.id===id);
function touched(id){const b=byId(id);if(!b)return;
  b.lastContact=today();b.nextTouch=addDays(today(),CAD[b.heat||3]||3);
  if(b.stage==='Snoozed'){b.stage='Qualified';b.snoozedUntil=null}
  (b.touches=b.touches||[]).push({date:today(),channel:'wa',summary:'Touched (dashboard)'});
  render();queueSave('data/buyers.json',BUYERS,`CRM: touched ${b.buyer}`);}
function timeline(b){
  const items=[...(b.touches||[]).map(t=>({d:t.date,ic:t.channel==='call'?'📞':t.channel==='viewing'?'🏠':t.channel==='manual'?'📝':'💬',x:t.summary})),
    ...VIEWINGS.filter(v=>v.buyer&&b.buyer&&v.buyer.toLowerCase().includes(b.buyer.split(' ')[0].toLowerCase())).map(v=>({d:v.date,ic:'🏠',x:`Viewing ${v.unit||''} — ${v.outcome||''}`}))]
    .sort((a,b)=>(b.d||'').localeCompare(a.d||''));
  return items.map(i=>`<div class="tlrow"><div class="tlic">${i.ic}</div><div class="tlbody"><div class="tldate">${i.d||''}</div><div class="tltext">${i.x||''}</div></div></div>`).join('')||'<div style="color:var(--muted);font-size:13px;padding:8px 0">No history yet — the bridge and history upload will fill this.</div>';
}
function phoneOf(b){const m=JSON.stringify(b).match(/\+?\d{10,15}/);return m?m[0].replace(/\D/g,''):null}
function openCard(id){const b=byId(id);if(!b)return;
  const ph=phoneOf(b);
  $('mbox').innerHTML=`<div class="phead">
    <div class="heatball"><b>${scr(b)}</b><span>SCORE</span></div>
    <div class="pmeta"><h2>${b.buyer}</h2><div class="sub">${b.stage} · ${b.area||''} ${[b.cluster1,b.cluster2].filter(Boolean).join(', ')}</div>${ph?`<div class="sub" style="margin-top:2px">📱 <a href="tel:+${ph}" style="color:var(--lgold)">+${ph}</a> · <a href="https://wa.me/${ph}" target="_blank" style="color:var(--lgold)">WhatsApp</a></div>`:`<div class="sub" style="margin-top:2px;color:#c07">📱 no number — add one (dedupe key)</div>`}
      <div class="pills">${b.budget?`<span class="pill">💰 ${fmtB(b.budget)}</span>`:''}${b.beds?`<span class="pill">🛏 ${b.beds} bed</span>`:''}${b.finance?`<span class="pill">🏦 ${b.finance}</span>`:''}<span class="pill">⏰ ${b.nextTouch||'no touch set'}</span></div></div>
    <div style="display:flex;gap:6px;flex-direction:column">${ph?`<a class="act" href="https://wa.me/${ph}" target="_blank">💬 WhatsApp</a><a class="act" href="tel:+${ph}">📞 Call</a>`:'<span style="font-size:11px;color:var(--muted)">no number on file</span>'}</div>
  </div>
  <div class="drivers">${heatDrivers(b)}</div>
  <div class="mrow">
    <button class="btn mini" onclick="touched('${b.id}');openCard('${b.id}')">Touched ✓</button>
    <button class="btn sec mini" onclick="heatCh('${b.id}',1)">Score +</button>
    <button class="btn sec mini" onclick="heatCh('${b.id}',-1)">Score −</button>
    <button class="btn sec mini" onclick="addNote('${b.id}')">📝 Note</button>
    <select onchange="stageSel('${b.id}',this.value)">${STAGES.concat('Snoozed').map(s=>`<option ${s===b.stage?'selected':''}>${s}</option>`).join('')}</select>
    <input type="date" id="snz"><button class="btn sec mini" onclick="snooze('${b.id}')">💤</button>
  </div>
  <div style="margin-top:10px;font-size:13px;color:var(--cream)">${(b.notes||'')}</div>
  <h3 style="color:var(--lgold);font-size:15px;margin-top:12px">Timeline</h3>
  <div class="tl">${timeline(b)}</div>
  <div class="mrow"><button class="btn" onclick="closeModal()">Close</button></div>`;
  $('modal').classList.remove('hidden');}
function openStock(id){const s=STOCK.find(x=>String(x.id)===String(id));if(!s)return;
  $('mbox').innerHTML=`<div class="phead"><div class="pmeta"><h2>${s.cluster||''} ${s.unit||''}</h2>
   <div class="sub">${sStage(s)} · seller: ${s.seller||'?'}</div>
   <div class="pills">${s.price?`<span class="pill">💰 ${fmtB(s.price)}</span>`:''}${s.beds?`<span class="pill">🛏 ${s.beds} bed</span>`:''}</div></div></div>
  <div style="font-size:13px;white-space:pre-wrap">${s.notes||s.note||''}</div>
  <div class="mrow"><select onchange="stockStage('${s.id}',this.value)">${SSTAGES.map(x=>`<option ${x===sStage(s)?'selected':''}>${x}</option>`).join('')}</select>
  <button class="btn" onclick="closeModal()">Close</button></div>`;
  $('modal').classList.remove('hidden');}
function stockStage(id,st){const s=STOCK.find(x=>String(x.id)===String(id));if(!s)return;s.stage=st;renderSellers();queueSave('data/stock.json',STOCK,`CRM: ${s.unit} → ${st}`);closeModal();}
function heatCh(id,d){const b=byId(id);b.score=Math.min(5,Math.max(1,Math.round((b.score||3)+d)));b.heat=b.score;render();queueSave('data/buyers.json',BUYERS,'CRM: score '+b.buyer);openCard(id)}
function addNote(id){const n=prompt('Note:');if(!n)return;const b=byId(id);
  (b.touches=b.touches||[]).push({date:today(),channel:'manual',summary:n});
  queueSave('data/buyers.json',BUYERS,'CRM: note '+b.buyer);openCard(id);}
function snooze(id){const v=$('snz').value;if(!v)return;const b=byId(id);b.stage='Snoozed';b.snoozedUntil=v;b.nextTouch=v;b.touchReason='Snoozed — wake '+v;render();queueSave('data/buyers.json',BUYERS,'CRM: snoozed '+b.buyer);closeModal()}
function stageSel(id,v){const b=byId(id);b.stage=v;render();queueSave('data/buyers.json',BUYERS,'CRM: '+b.buyer+' → '+v);openCard(id)}
function closeModal(){$('modal').classList.add('hidden')}
function bedsOf(s){if(!s)return[];return String(s).match(/\d/g)?.map(Number)||[]}
function clustersOf(b){return[b.cluster1,b.cluster2,b.cluster3].filter(Boolean).map(x=>x.toLowerCase())}
function computeMatches(){
  const act=STOCK.filter(u=>sStage(u)==='Active'&&u.price);
  const live=BUYERS.filter(b=>!['Won','Lost'].includes(b.stage));
  const out=[];
  for(const u of act){
    const uB=bedsOf(u.beds),uc=(u.cluster||'').toLowerCase();
    const hits=live.filter(b=>{
      const bb=bedsOf(b.beds),bc=clustersOf(b);
      return(!uB.length||!bb.length||uB.some(x=>bb.includes(x)))&&(!bc.length||bc.some(c=>uc.includes(c)||c.includes(uc)))&&(!b.budget||b.budget>=u.price*0.9);
    }).sort((a,b)=>(b.score||0)-(a.score||0));
    if(hits.length)out.push({u,hits});
  }
  return out.sort((a,b)=>b.hits.length-a.hits.length);
}
const normPh=p=>String(p||'').replace(/\D/g,'').replace(/^00/,'').replace(/^0/,'971');
function dupeByPhone(p){const n=normPh(p);if(!n)return null;return BUYERS.find(b=>normPh(b.phone)===n||(!b.phone&&phoneOf(b)===n));}
function newBuyer(){
  const name=prompt('Name?');if(!name)return;
  const phone=prompt('Phone (+971…)?')||'';
  const dup=dupeByPhone(phone);
  if(dup){alert('That number already belongs to "'+dup.buyer+'" — opening their profile instead. No duplicates.');openCard(dup.id);return;}
  const budget=parseFloat(prompt('Budget AED?')||'0')||0;
  const beds=prompt('Beds?')||'';const clu=prompt('Cluster/area?')||'';
  const heat=Math.min(5,Math.max(1,parseInt(prompt('Heat 1-5?')||'3')||3));
  const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString().slice(-4);
  BUYERS.push({buyer:name,notes:phone?('Ph: '+phone):'',source:'Manual',date:today(),status:'Active',area:'',cluster1:clu,cluster2:'',cluster3:'',beds,finance:'',budget,stage:'New',heat,lastContact:today(),nextTouch:addDays(today(),CAD[heat]||3),touchReason:'New lead',needSummary:(beds?beds+'bd ':'')+(clu||'')+(budget?(' ~'+fmtB(budget)):''),snoozedUntil:null,touches:[{date:today(),channel:'manual',summary:'Created on dashboard'}],id,order:99});
  render();queueSave('data/buyers.json',BUYERS,'CRM: new buyer '+name);
}
async function init(){
  if(PAT)$('connectBox').classList.add('hidden');
  try{await fetchAll();render();$('syncTxt').textContent=BUYERS.length+' buyers · '+STOCK.length+' units'}
  catch(e){$('syncTxt').textContent='Load failed — check token'}
}
init();
</script>
</body>
