<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM — Buyers</title>
<style>
:root{--bg:#152A1F;--panel:#1E3D2F;--gold:#C9A84C;--lgold:#E8C96B;--cream:#F5EDE0;--muted:#8FA898;--div:#2E5A40;--red:#f85149;--green:#3fb950;--amber:#d29922}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--cream);font-family:Calibri,'Segoe UI',sans-serif;min-height:100vh;padding:14px}
h1,h2,h3{font-family:'Palatino Linotype',Palatino,serif}
.eyebrow{letter-spacing:4px;font-size:12px;font-weight:bold;color:var(--gold);text-transform:uppercase;text-align:center;margin:6px 0 2px}
h1{text-align:center;font-size:26px;margin-bottom:12px}
.connect{background:var(--panel);border:1px solid var(--div);border-radius:12px;padding:14px;max-width:560px;margin:0 auto 14px}
.connect input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--div);background:#12241b;color:var(--cream);margin:8px 0}
.btn{background:var(--gold);color:#152A1F;font-weight:bold;border:none;border-radius:9px;padding:10px 16px;cursor:pointer;font-size:14px}
.btn.sec{background:transparent;color:var(--lgold);border:1px solid var(--div)}
.hidden{display:none!important}
#touches{background:var(--panel);border:1px solid var(--div);border-radius:14px;padding:12px;margin:0 auto 16px;max-width:1200px}
#touches h2{color:var(--lgold);font-size:18px;margin-bottom:8px}
.touchrow{display:flex;align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--div);flex-wrap:wrap}
.touchrow:first-of-type{border-top:none}
.tname{font-weight:bold;min-width:130px}
.treason{color:var(--muted);font-size:13px;flex:1;min-width:160px}
.due-over{color:var(--red);font-size:12px;font-weight:bold}
.due-today{color:var(--amber);font-size:12px;font-weight:bold}
.mini{padding:6px 10px;font-size:12px;border-radius:7px}
#board{display:flex;gap:12px;overflow-x:auto;padding-bottom:20px;max-width:1400px;margin:0 auto}
.col{background:var(--panel);border:1px solid var(--div);border-radius:14px;min-width:240px;width:240px;flex:0 0 auto;padding:10px}
.col h3{font-size:14px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);display:flex;justify-content:space-between;margin-bottom:8px}
.col .count{color:var(--muted);font-family:Calibri}
.col.dragover{outline:2px dashed var(--lgold)}
.card{background:#162b20;border:1px solid var(--div);border-radius:11px;padding:10px;margin-bottom:9px;cursor:grab}
.card:active{cursor:grabbing}
.card .nm{font-weight:bold;font-size:15px}
.heat{color:var(--lgold);font-size:12px;letter-spacing:1px}
.card .need{color:var(--muted);font-size:12px;margin:4px 0}
.card .nt{font-size:12px}
.nt.over{color:var(--red)} .nt.today{color:var(--amber)} .nt.ok{color:var(--muted)}
.bdg{font-size:12px;color:var(--cream)}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:14px;z-index:50}
#mbox{background:var(--panel);border:1px solid var(--div);border-radius:16px;max-width:560px;width:100%;max-height:88vh;overflow-y:auto;padding:18px}
#mbox h2{color:var(--lgold);margin-bottom:2px}
#mbox .sub{color:var(--muted);font-size:13px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--div);font-size:14px}
.kv b{color:var(--lgold)}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.notes{color:var(--cream);font-size:13px;margin-top:10px;white-space:pre-wrap}
.thist{margin-top:10px;font-size:12px;color:var(--muted)}
select,input[type=date]{background:#12241b;color:var(--cream);border:1px solid var(--div);border-radius:7px;padding:8px}
#sync{position:fixed;bottom:10px;left:12px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:5px}
</style>
</head>
<body>
<div class="eyebrow">White &amp; Co · Calum MacLeod</div>
<h1>Buyer CRM</h1>
<div class="connect" id="connectBox">
  <b>🔌 Connect GitHub</b>
  <div style="color:var(--muted);font-size:13px;margin-top:4px">Paste the GitHub token (stored only in this browser).</div>
  <input id="patIn" placeholder="github_pat_..." />
  <button class="btn" onclick="savePat()">Save &amp; connect</button>
</div>
<div id="touches" class="hidden"><h2>Today's Touches</h2><div id="touchList"></div></div>
<div id="matches" class="hidden" style="background:var(--panel);border:1px solid var(--div);border-radius:14px;padding:12px;margin:0 auto 16px;max-width:1200px">
<h2 style="color:var(--lgold);font-size:18px;margin-bottom:8px">Unit ↔ Buyer Matches</h2><div id="matchList"></div></div>
<div style="max-width:1200px;margin:0 auto 10px;display:flex;justify-content:flex-end">
<button class="btn" onclick="newBuyer()">+ New Buyer</button></div>
<div id="board"></div>
<div id="modal" class="hidden"><div id="mbox"></div></div>
<div id="sync"><span class="dot"></span><span id="syncTxt">Loading…</span></div>
<script>
const OWNER='calum7macleod', REPO='dashboards', PATH='data/buyers.json';
const STAGES=['New','Qualified','Viewing','Offer','Won','Lost'];
let showSnoozed=false;
const CAD={5:1,4:2,3:3,2:4,1:5};
let BUYERS=[], STOCK=[], SHA=null, PAT=localStorage.getItem('crm_pat')||localStorage.getItem('gh_pat')||'';
const $=id=>document.getElementById(id);
function today(){return new Date().toISOString().slice(0,10)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x.toISOString().slice(0,10)}
function savePat(){PAT=$('patIn').value.trim();if(!PAT)return;localStorage.setItem('crm_pat',PAT);init()}
async function fetchData(){
  const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}?ref=main&t=${Date.now()}`,{headers:PAT?{Authorization:'Bearer '+PAT}:{}});
  const j=await r.json(); SHA=j.sha;
  BUYERS=JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))));
  try{const r2=await fetch(`https://raw.githubusercontent.com/${OWNER}/${REPO}/main/data/stock.json?t=${Date.now()}`);STOCK=await r2.json();}catch(e){STOCK=[]}
}
let saveTimer=null, dirty=false;
function queueSave(msg){dirty=true;$('syncTxt').textContent='Saving…';clearTimeout(saveTimer);saveTimer=setTimeout(()=>push(msg),1200)}
async function push(msg){
  try{
    const body={message:msg||'CRM update',content:btoa(unescape(encodeURIComponent(JSON.stringify(BUYERS,null,1)))),sha:SHA,branch:'main'};
    const r=await fetch(`https://api.github.com/repos/${OWNER}/${REPO}/contents/${PATH}`,{method:'PUT',headers:{Authorization:'Bearer '+PAT,'Content-Type':'application/json'},body:JSON.stringify(body)});
    const j=await r.json();
    if(r.ok){SHA=j.content.sha;dirty=false;$('syncTxt').textContent='Synced '+new Date().toLocaleTimeString()}
    else{ if(r.status===409){await fetchData();$('syncTxt').textContent='Conflict — refreshed, redo last change'} else $('syncTxt').textContent='Save failed ('+r.status+')'; }
  }catch(e){$('syncTxt').textContent='Offline — will retry';setTimeout(()=>push(msg),4000)}
}
function heatStr(h){return '🔥'.repeat(h||0)||'—'}
function ntClass(nt){if(!nt)return'ok';if(nt<today())return'over';if(nt===today())return'today';return'ok'}
function fmtB(b){return b? 'Đ'+(b/1e6).toFixed(2).replace(/\.?0+$/,'')+'M':''}
function render(){
  // Today's touches
  const due=BUYERS.filter(b=>!['Won','Lost','Snoozed'].includes(b.stage)&&b.nextTouch&&b.nextTouch<=today())
    .sort((a,b)=>(b.heat||0)-(a.heat||0)||a.nextTouch.localeCompare(b.nextTouch));
  const wake=BUYERS.filter(b=>b.stage==='Snoozed'&&b.snoozedUntil&&b.snoozedUntil<=today());
  const rows=[...wake.map(b=>tr(b,true)),...due.map(b=>tr(b,false))];
  $('touchList').innerHTML=rows.join('')||'<div style="color:var(--muted);padding:6px">Nothing due — clear runway 👌</div>';
  $('touches').classList.remove('hidden');
  // Board
  $('board').innerHTML=STAGES.map(st=>{
    const cards=BUYERS.filter(b=>b.stage===st||(st==='New'&&!b.stage)).sort((a,b)=>(b.heat||0)-(a.heat||0));
    return `<div class="col" data-stage="${st}" ondragover="dragOver(event)" ondragleave="this.classList.remove('dragover')" ondrop="drop(event,'${st}')">
      <h3>${st} <span class="count">${cards.length}</span></h3>
      ${cards.map(b=>cardHtml(b)).join('')}
    </div>`;
  }).join('') + snoozedCol();
  renderMatches();
}
function tr(b,isWake){
  return `<div class="touchrow"><span class="tname">${b.buyer}</span>
   <span class="${b.nextTouch<today()?'due-over':'due-today'}">${isWake?'WAKING':'DUE '+(b.nextTouch<today()?'· overdue':'today')}</span>
   <span class="treason">${b.touchReason||b.needSummary||''}</span>
   <button class="btn mini" onclick="touched('${b.id}')">Touched ✓</button>
   <button class="btn sec mini" onclick="openCard('${b.id}')">Open</button></div>`;
}

function bedsOf(s){if(!s)return[];return String(s).match(/\d/g)?.map(Number)||[]}
function clustersOf(b){return [b.cluster1,b.cluster2,b.cluster3].filter(Boolean).map(x=>x.toLowerCase())}
function computeMatches(){
  const act=STOCK.filter(u=>(u.status||'').toLowerCase()==='active'&&u.price);
  const live=BUYERS.filter(b=>!['Won','Lost'].includes(b.stage));
  const out=[];
  for(const u of act){
    const uBeds=bedsOf(u.beds), uc=(u.cluster||'').toLowerCase();
    const hits=live.filter(b=>{
      const bb=bedsOf(b.beds), bc=clustersOf(b);
      const bedOk=!uBeds.length||!bb.length||uBeds.some(x=>bb.includes(x));
      const cluOk=!bc.length||bc.some(c=>uc.includes(c)||c.includes(uc));
      const budOk=!b.budget||b.budget>=u.price*0.9;
      return bedOk&&cluOk&&budOk;
    }).sort((a,b)=>(b.heat||0)-(a.heat||0));
    if(hits.length)out.push({u,hits});
  }
  return out.sort((a,b)=>b.hits.length-a.hits.length);
}
function renderMatches(){
  const M=computeMatches();
  $('matchList').innerHTML=M.slice(0,12).map(({u,hits})=>
    `<div class="touchrow"><span class="tname">${u.cluster} ${u.unit}</span>
     <span class="bdg">${fmtB(u.price)}${u.beds?' · '+u.beds+'bd':''}</span>
     <span class="treason">${hits.slice(0,6).map(h=>`${h.buyer} ${'🔥'.repeat(h.heat||0)}${h.stage==='Snoozed'?' 💤':''}`).join('  ·  ')}${hits.length>6?' +'+(hits.length-6):''}</span>
    </div>`).join('')||'<div style="color:var(--muted);padding:6px">No matches yet — fill buyer budgets/beds to light this up</div>';
  $('matches').classList.remove('hidden');
}


function cardHtml(b){
  return `<div class="card" draggable="true" ondragstart="drag(event,'${b.id}')" onclick="openCard('${b.id}')">
    <div class="nm">${b.buyer||'?'}</div>
    <div class="heat">${heatStr(b.heat)} <span class="bdg">${fmtB(b.budget)}</span></div>
    <div class="need">${(b.needSummary||'').slice(0,70)}</div>
    <div class="nt ${ntClass(b.nextTouch)}">\u23f0 ${b.nextTouch||'\u2014'}</div>
  </div>`;
}
function snoozedCol(){
  const sn=BUYERS.filter(b=>b.stage==='Snoozed').sort((a,b)=>(a.snoozedUntil||'9').localeCompare(b.snoozedUntil||'9'));
  return `<div class="col" style="opacity:.85" ondragover="dragOver(event)" ondragleave="this.classList.remove('dragover')" ondrop="drop(event,'Snoozed')">
    <h3 onclick="showSnoozed=!showSnoozed;render()" style="cursor:pointer">\ud83d\udca4 Snoozed <span class="count">${sn.length} ${showSnoozed?'\u25be':'\u25b8'}</span></h3>
    ${showSnoozed? sn.map(b=>`<div class="card" draggable="true" ondragstart="drag(event,'${b.id}')" onclick="openCard('${b.id}')">
      <div class="nm">${b.buyer}</div><div class="heat">${heatStr(b.heat)}</div>
      <div class="nt ok">wakes ${b.snoozedUntil||'?'}</div>
      <div class="need">${(b.touchReason||'').slice(0,60)}</div></div>`).join('') : ''}
  </div>`;
}

let dragId=null;
function drag(e,id){dragId=id;e.dataTransfer.effectAllowed='move'}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('dragover')}
function drop(e,stage){e.preventDefault();e.currentTarget.classList.remove('dragover');
  const b=BUYERS.find(x=>x.id===dragId);if(!b)return;
  b.stage=stage; if(stage==='Won'||stage==='Lost')b.nextTouch=null;
  render();queueSave(`CRM: ${b.buyer} → ${stage}`);}
function byId(id){return BUYERS.find(x=>x.id===id)}
function touched(id){const b=byId(id);if(!b)return;
  b.lastContact=today();b.nextTouch=addDays(today(),CAD[b.heat||3]||3);
  if(b.stage==='Snoozed'){b.stage='Qualified';b.snoozedUntil=null}
  (b.touches=b.touches||[]).push({date:today(),channel:'wa',summary:'Touched (dashboard)'});
  render();queueSave(`CRM: touched ${b.buyer}`);}
function openCard(id){const b=byId(id);if(!b)return;
  $('mbox').innerHTML=`<h2>${b.buyer}</h2><div class="sub">${b.stage} · ${heatStr(b.heat)} · ${b.area||''} ${b.cluster1||''}</div>
   <div class="kv"><span>Budget</span><b>${fmtB(b.budget)||'—'}</b></div>
   <div class="kv"><span>Finance</span><b>${b.finance||'—'}</b></div>
   <div class="kv"><span>Beds</span><b>${b.beds||'—'}</b></div>
   <div class="kv"><span>Last contact</span><b>${b.lastContact||'—'}</b></div>
   <div class="kv"><span>Next touch</span><b>${b.nextTouch||'—'}</b></div>
   <div class="kv"><span>Why</span><b>${b.touchReason||'—'}</b></div>
   <div class="mrow">
     <button class="btn mini" onclick="touched('${b.id}');openCard('${b.id}')">Touched today ✓</button>
     <button class="btn sec mini" onclick="heatCh('${b.id}',1)">Heat +</button>
     <button class="btn sec mini" onclick="heatCh('${b.id}',-1)">Heat −</button>
   </div>
   <div class="mrow">Snooze: <input type="date" id="snz"/> <button class="btn sec mini" onclick="snooze('${b.id}')">Snooze 💤</button>
     <select id="stSel" onchange="stageSel('${b.id}')">${STAGES.concat('Snoozed').map(s=>`<option ${s===b.stage?'selected':''}>${s}</option>`).join('')}</select></div>
   <div class="notes">${b.notes||''}</div>
   <div class="thist">${(b.touches||[]).slice(-5).reverse().map(t=>`${t.date} · ${t.channel} · ${t.summary}`).join('<br>')}</div>
   <div class="mrow"><button class="btn" onclick="$('modal').classList.add('hidden')">Close</button></div>`;
  $('modal').classList.remove('hidden');}
function heatCh(id,d){const b=byId(id);b.heat=Math.min(5,Math.max(1,(b.heat||3)+d));render();queueSave('CRM: heat '+b.buyer);openCard(id)}
function snooze(id){const v=$('snz').value;if(!v)return;const b=byId(id);b.stage='Snoozed';b.snoozedUntil=v;b.nextTouch=v;b.touchReason='Snoozed — wake '+v;$('modal').classList.add('hidden');render();queueSave('CRM: snoozed '+b.buyer)}
function stageSel(id){const b=byId(id);b.stage=$('stSel').value;render();queueSave('CRM: '+b.buyer+' → '+b.stage);openCard(id)}
$('modal').addEventListener('click',e=>{if(e.target.id==='modal')$('modal').classList.add('hidden')});

function newBuyer(){
  const name=prompt('Name?'); if(!name)return;
  const phone=prompt('Phone (with +)?')||'';
  const budget=parseFloat(prompt('Budget AED (e.g. 2600000, blank if unknown)?')||'0')||0;
  const beds=prompt('Beds (e.g. 4 or 4-5)?')||'';
  const clu=prompt('Cluster/area (e.g. Costa Brava)?')||'';
  const heat=Math.min(5,Math.max(1,parseInt(prompt('Heat 1-5?')||'3')||3));
  const id=name.toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Date.now().toString().slice(-4);
  BUYERS.push({buyer:name, notes:phone?('Ph: '+phone):'', source:'Manual', date:today(), status:'Active',
    area:'', cluster1:clu, cluster2:'', cluster3:'', beds:beds, finance:'', budget:budget,
    stage:'New', heat:heat, lastContact:today(), nextTouch:addDays(today(),CAD[heat]||3),
    touchReason:'New lead - first proper conversation', needSummary:(beds?beds+'bd ':'')+(clu||'')+(budget?(' ~'+fmtB(budget)):''),
    snoozedUntil:null, touches:[{date:today(),channel:'manual',summary:'Created on dashboard'}], id:id, order:99});
  render(); queueSave('CRM: new buyer '+name);
}

async function init(){
  if(PAT)$('connectBox').classList.add('hidden');
  try{await fetchData();render();$('syncTxt').textContent='Loaded '+BUYERS.length+' buyers'}
  catch(e){$('syncTxt').textContent='Load failed — check token/connection'}
}
init();
</script>
</body>
</html>
