<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Journal - Calum MacLeod</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Calibri,'Segoe UI',sans-serif;background:#152A1F;color:#F5EDE0;min-height:100vh}
.header{background:linear-gradient(180deg,#1E3D2F,#152A1F);padding:20px 28px 14px}
.eyebrow{font-size:10px;letter-spacing:.28em;color:#C9A84C;font-weight:700}
h1{font-family:'Palatino Linotype',Palatino,Georgia,serif;font-weight:400;font-size:28px;margin-top:2px}
.sub{color:#8FA898;font-size:12px;margin-top:2px}
.wrap{max-width:1100px;margin:0 auto;padding:20px 24px 50px}
.today{background:#1E3D2F;border:1px solid #2E5A40;border-radius:16px;padding:18px;margin-bottom:16px}
.t-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.t-date{font-family:'Palatino Linotype',Palatino,serif;font-size:20px}
.t-total{font-family:'Palatino Linotype',Palatino,serif;font-size:26px;color:#E8C96B}
.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.m{background:#182F24;border:1px solid #2E5A40;border-radius:12px;padding:10px;text-align:center}
.m .k{font-size:9px;letter-spacing:.14em;color:#8FA898;font-weight:700}
.m .v{font-family:'Palatino Linotype',Palatino,serif;font-size:24px;margin-top:3px}
.m .bar{height:5px;background:#0F211A;border-radius:3px;margin-top:7px;overflow:hidden}
.m .fill{height:100%;background:linear-gradient(90deg,#8a6f2a,#E8C96B);border-radius:3px}
.empty{color:#8FA898;font-size:13px;padding:8px 0}
.card{background:#1E3D2F;border:1px solid #2E5A40;border-radius:16px;padding:18px;margin-bottom:16px}
.label{font-size:11px;letter-spacing:.14em;color:#C9A84C;font-weight:700;margin-bottom:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{color:#C9A84C;text-align:left;font-size:10px;letter-spacing:.1em;padding:6px 8px;border-bottom:1px solid #2E5A40}
td{padding:7px 8px;border-bottom:1px solid #23422F}
tr:hover td{background:#20402F}
.score{display:inline-block;min-width:22px;text-align:center;border-radius:6px;padding:1px 5px;font-weight:700}
.s5{background:rgba(201,168,76,.25);color:#E8C96B}.s4{background:rgba(143,191,159,.2);color:#8FBF9F}
.s3{background:rgba(143,168,152,.15);color:#8FA898}.s2,.s1{background:rgba(242,139,130,.15);color:#f28b82}
.avgs{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.note{color:#8FA898;font-style:italic}
@media(max-width:760px){.metrics,.avgs{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="header">
 <div class="eyebrow">CALUM MACLEOD &nbsp;◆&nbsp; COMMAND CENTRE</div>
 <h1 class="header-title">Daily Journal</h1>
 <div class="sub">Eating · Water · Exercise · Sleep · Mindset · Focus - scored 1-5 with Max at the 19:30 shutdown</div>
</div>
<div class="wrap">
 <div class="today" id="today-card"><div class="empty">Loading...</div></div>
 <div class="card"><div class="label">◆ LAST 14 DAYS</div><div id="history"></div></div>
 <div class="card"><div class="label">◆ 7-DAY AVERAGES</div><div class="avgs" id="avgs"></div></div>
</div>
<script>
const METRICS=["eating","water","exercise","sleep","mindset","focus"];
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
fetch("data/journal.json?t="+Date.now()).then(r=>r.json()).then(arr=>{
 arr.sort((a,b)=>a.date<b.date?1:-1);
 const t=arr.find(e=>e.date===todayStr());
 const tc=document.getElementById("today-card");
 if(t){
  const total=METRICS.reduce((s,m)=>s+(t[m]||0),0);
  tc.innerHTML='<div class="t-head"><div class="t-date">Today · '+new Date(t.date).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"})+'</div><div class="t-total">'+total+' / 30</div></div>'+
  '<div class="metrics">'+METRICS.map(m=>'<div class="m"><div class="k">'+m.toUpperCase()+'</div><div class="v">'+(t[m]??"-")+'</div><div class="bar"><div class="fill" style="width:'+((t[m]||0)*20)+'%"></div></div></div>').join("")+'</div>'+
  (t.note?'<div class="note" style="margin-top:10px">"'+t.note+'"</div>':"");
 } else {
  tc.innerHTML='<div class="t-head"><div class="t-date">Today</div><div class="t-total">- / 30</div></div><div class="empty">Not logged yet - send Max your scores at the 19:30 shutdown.</div>';
 }
 document.getElementById("history").innerHTML = arr.length ?
  '<table><tr><th>DATE</th>'+METRICS.map(m=>'<th>'+m.slice(0,5).toUpperCase()+'</th>').join("")+'<th>TOTAL</th><th>NOTE</th></tr>'+
  arr.slice(0,14).map(e=>{
   const tot=METRICS.reduce((s,m)=>s+(e[m]||0),0);
   return '<tr><td>'+new Date(e.date).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})+'</td>'+
    METRICS.map(m=>'<td><span class="score s'+(e[m]||1)+'">'+(e[m]??"-")+'</span></td>').join("")+
    '<td><b>'+tot+'</b></td><td class="note">'+(e.note||"")+'</td></tr>';
  }).join("")+'</table>' : '<div class="empty">First entry lands tonight.</div>';
 const last7=arr.slice(0,7);
 document.getElementById("avgs").innerHTML=METRICS.map(m=>{
  const vals=last7.map(e=>e[m]).filter(v=>v!=null);
  const avg=vals.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(1):"-";
  return '<div class="m"><div class="k">'+m.toUpperCase()+'</div><div class="v">'+avg+'</div></div>';
 }).join("");
}).catch(e=>{document.getElementById("today-card").innerHTML='<div class="empty">Could not load journal data.</div>'});
</script>
</body>
</html>
