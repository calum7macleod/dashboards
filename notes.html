<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notepad</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<style>
:root{--bg:#152A1F;--panel:#1E3D2F;--gold:#C9A84C;--lgold:#E8C96B;--cream:#F5EDE0;--muted:#8FA898;--div:#2E5A40}
body{margin:0;background:var(--bg);color:var(--cream);font-family:Calibri,Carlito,"Segoe UI",sans-serif;padding:18px;max-width:1000px;margin:auto}
.eyebrow{color:var(--gold);font-size:11px;letter-spacing:.3em;text-transform:uppercase;font-weight:700}
h1{font-family:Palatino,"Palatino Linotype",serif;font-weight:400;font-size:28px;margin:4px 0 2px}
.sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.cat{background:var(--panel);border:1px solid var(--div);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.cat h2{font-family:Palatino,serif;font-weight:400;font-size:20px;color:var(--lgold);margin:0 0 2px}
.cat .d{color:var(--muted);font-size:12px;margin-bottom:8px}
.n{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--div);font-size:14.5px;line-height:1.45}
.n .dt{color:var(--muted);font-size:11px;white-space:nowrap;padding-top:3px}
.n.done{color:var(--muted);text-decoration:line-through}
a{color:var(--gold)}
</style></head><body>
<div class="eyebrow">◆ &nbsp;Max &middot; Notepad &nbsp;◆</div>
<h1>Things to remember, by who they're for</h1>
<div class="sub" id="sub">Loading…</div>
<div id="list"></div>
<p class="sub" style="margin-top:16px"><a href="hub.html">← hub</a></p>
<script>
function esc(s){return String(s||'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
fetch('data/notes.json?t='+Date.now()).then(r=>r.json()).then(j=>{
  const cats=Object.entries(j.categories||{}); let n=0;
  document.getElementById('list').innerHTML=cats.map(([k,c])=>{n+=(c.items||[]).length;
    return '<div class="cat"><h2>'+esc(k)+'</h2><div class="d">'+esc(c.desc||'')+'</div>'+(c.items||[]).map(i=>'<div class="n'+(i.done?' done':'')+'"><span class="dt">'+esc(i.date)+'</span><span>'+esc(i.note)+'</span></div>').join('')+'</div>';}).join('')||'<div class="sub">Nothing yet.</div>';
  document.getElementById('sub').textContent=n+' notes across '+cats.length+' categories';
});
</script></body></html>
